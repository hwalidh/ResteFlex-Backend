spring:
  application:
    name: resteflex-listings-api
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

supabase:
  url: ${SUPABASE_URL:https://ocutxszgjnmztdawuwgt.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:sb_publishable_7-jupaDnqhSq7u-vrs5Cpg_4DsoOYgQ}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
